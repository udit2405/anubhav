name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          # With a custom domain (repo variable CUSTOM_DOMAIN, e.g. anubhav.in) the site is served from the root.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '' && '/anubhav' || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://udit2405.github.io/anubhav' }}
          # Set these under Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_WHATSAPP: ${{ vars.WHATSAPP }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
